<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Personal Finance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #2563eb;
            font-size: 28px;
        }

        .logo p {
            color: #6b7280;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #172033;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d9e2;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        /* =========================================
           FORGOT PASSWORD
        ========================================= */

        .forgot-password {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* =========================================
           REGISTER
        ========================================= */

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* =========================================
           ALERT
        ========================================= */

        .alert {
            padding: 10px 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Logo -->

        <div class="logo">

            <h1>
                Personal Finance Tracker
            </h1>

            <p>
                Welcome back
            </p>

        </div>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <!-- Login Form -->

        <form method="POST">

            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Forgot Password -->

            <div class="forgot-password">

                <a href="{{ url_for('auth.forgot_password') }}">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- Register -->

        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
