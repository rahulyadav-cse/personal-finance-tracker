<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Personal Finance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f7fb;
        }

        .container {
            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #dbeafe;

            font-size: 28px;
        }

        .logo h1 {
            margin: 0;

            color: #2563eb;

            font-size: 27px;
        }

        .logo p {
            margin-top: 9px;

            color: #6b7280;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #172033;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d5d9e2;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .reset-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .reset-btn:hover {
            background: #1d4ed8;
        }

        .back-login {
            text-align: center;

            margin-top: 22px;

            color: #6b7280;

            font-size: 14px;
        }

        .back-login a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px 12px;

            margin-bottom: 18px;

            border-radius: 8px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="logo">

            <div class="icon">
                🔐
            </div>

            <h1>
                Forgot Password
            </h1>

            <p>
                Enter your registered email address
            </p>

        </div>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <!-- Form -->

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                Continue
            </button>

        </form>


        <!-- Back to Login -->

        <div class="back-login">

            Remember your password?

            <a href="{{ url_for('auth.login') }}">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
